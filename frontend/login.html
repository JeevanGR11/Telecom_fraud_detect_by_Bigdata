<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELECOM – Sign In | Telecommunication Fraud Detection Using Hadoop MapReduce</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <img src="assets/logo.svg" alt="TELECOM" style="height: 48px;">
            <h1 class="auth-title">Welcome to TELECOM</h1>
            <p class="auth-subtitle">Telecommunication Fraud Detection System Using Hadoop MapReduce</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert" style="font-size: 13.5px;"></div>
        <div id="loginSuccess" class="alert alert-success d-none" role="alert" style="font-size: 13.5px;"></div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label mb-0">Password</label>
                    <a href="javascript:void(0)" onclick="handleForgotPassword()" class="text-decoration-none" style="font-size: 12.5px; color: var(--brand-primary); font-weight: 500;">Forgot Password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary" for="rememberMe" style="font-size: 13px;">
                        Remember Me
                    </label>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2" style="font-size: 15px;">
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                Sign In to Platform
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-secondary" style="font-size: 13.5px;">Don't have an account? </span>
            <a href="register.html" style="color: var(--brand-primary); font-weight: 600; text-decoration: none; font-size: 13.5px;">Create Account</a>
        </div>

        <!-- Demo Credentials Box -->
        <div class="demo-credentials-box">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <strong style="color: var(--text-primary); font-size: 12.5px;"><i class="bi bi-key-fill text-danger me-1"></i> Quick Demo Logins</strong>
                <span class="badge bg-light text-dark border" style="font-size: 10px;">Click to autofill</span>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-danger flex-fill" onclick="autofill('demo', 'demo123')" style="font-size: 11.5px;">
                    <i class="bi bi-person me-1"></i> Investigator (demo)
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark flex-fill" onclick="autofill('admin', 'admin123')" style="font-size: 11.5px;">
                    <i class="bi bi-shield-lock me-1"></i> Admin (admin)
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                passInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function autofill(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        function handleForgotPassword() {
            alert('To reset credentials, please contact the system administrator or use the demo accounts: demo/demo123 or admin/admin123.');
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            const successBox = document.getElementById('loginSuccess');
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginBtnSpinner');

            alertBox.classList.add('d-none');
            successBox.classList.add('d-none');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                alertBox.textContent = 'Please enter both username and password.';
                alertBox.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            spinner.classList.remove('d-none');

            const res = await api.post('/auth/login', { username, password, rememberMe });
            btn.disabled = false;
            spinner.classList.add('d-none');

            if (res && res.ok && res.data && res.data.success) {
                api.setToken(res.data.token);
                api.setUser(res.data.user);

                successBox.textContent = 'Login successful! Redirecting to dashboard...';
                successBox.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            } else {
                const err = (res && res.data && res.data.message) || (res && res.data && res.data.error) || 'Invalid credentials. Please verify your login.';
                alertBox.textContent = err;
                alertBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
