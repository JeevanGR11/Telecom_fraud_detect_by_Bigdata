<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#C1121F"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Icon: Shield with Telecom Wave and Pulse -->
  <g transform="translate(10, 8)">
    <!-- Shield Outline -->
    <path d="M32 4 L56 14 C56 42 32 58 32 62 C32 58 8 42 8 14 Z" fill="url(#shieldGrad)" />
    
    <!-- Telecom Tower Wave Arc 1 -->
    <path d="M22 22 A 14 14 0 0 1 42 22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Telecom Tower Wave Arc 2 -->
    <path d="M17 16 A 21 21 0 0 1 47 16" fill="none" stroke="#E63946" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center Tower / Signal Mast -->
    <line x1="32" y1="26" x2="32" y2="46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="24" r="3.5" fill="#E63946"/>
    <!-- Signal Mast Base Cross -->
    <line x1="24" y1="46" x2="40" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="40" x2="38" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Security Padlock / Radar Accent -->
    <circle cx="48" cy="46" r="11" fill="url(#brandGrad)"/>
    <path d="M44 46 L47 49 L53 43" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#1E293B" letter-spacing="1.5">TELE<tspan fill="#E63946">COM</tspan></text>
  <text x="83" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="0.5">FRAUD DETECTION SYSTEM</text>
  <rect x="236" y="49" width="70" height="13" rx="3" fill="#F1F5F9"/>
  <text x="241" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#E63946" letter-spacing="0.4">HADOOP MR</text>
</svg>
