# ==============================================================
# TELECOM – Application Configuration
# ==============================================================

server.port=8080
spring.application.name=telecom-fraud-detection

# Default: File-based MySQL-mode database (zero setup required)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/telecomdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Static Web Resources
spring.web.resources.static-locations=file:frontend/,classpath:/static/

# File Upload Multipart limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Hadoop Configuration Defaults
telecom.hadoop.namenode.url=${HADOOP_NAMENODE_URL:hdfs://localhost:9000}
telecom.hadoop.hdfs.input-path=/telecom/cdr/input
telecom.hadoop.hdfs.output-path=/telecom/cdr/output
telecom.hadoop.local-workdir=./hadoop-work

# JWT Secret & Expiration
telecom.jwt.secret=TelecomFraudDetectionSystemSecretKeyForBigDataProject2026SecureBcryptToken
telecom.jwt.expiration-ms=86400000

# Logging
logging.level.com.telecom=INFO
logging.level.org.springframework.security=WARN
