# ==============================================================
# TELECOM – Production MySQL 8.0 Profile
# Activate via: java -jar -Dspring.profiles.active=mysql telecom-backend-1.0.0.jar
# ==============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/telecom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
